<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Fortune Teller</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Background stars -->
    <div class="stars"></div>
    <div class="stars stars2"></div>

    <!-- Decorative elements -->
    <div class="moon moon-left">☾</div>
    <div class="moon moon-right">☽</div>

    <main class="fortune-booth">

        <!-- Header -->
        <header class="header">
            <div class="small-title">✦ MYSTIC CRYSTAL ✦</div>

            <h1>EVENT FORTUNE TELLER</h1>

            <div class="subtitle">
                WHEEL OF DESTINY
            </div>
        </header>


        <!-- Crystal Area -->
        <section class="crystal-section">

            <div class="magic-ring ring-one"></div>
            <div class="magic-ring ring-two"></div>

            <div class="crystal-container" id="crystal">

                <div class="crystal-ball">

                    <!-- Shine -->
                    <div class="crystal-shine"></div>

                    <!-- Inner cosmic effect -->
                    <div class="cosmic-cloud cloud-one"></div>
                    <div class="cosmic-cloud cloud-two"></div>

                    <!-- Crystal symbol -->
                    <div class="crystal-symbol">✦</div>

                </div>

            </div>

            <!-- Stand -->
            <div class="crystal-stand">
                <div class="stand-decoration">☾</div>
                <div class="stand-stars">✦　✧　✦</div>
            </div>

        </section>


        <!-- Button -->
        <button id="revealBtn" class="reveal-btn">

            <span class="button-star">✦</span>

            <span id="buttonText">
                REVEAL MY DESTINY
            </span>

            <span class="button-star">✦</span>

        </button>


        <!-- Prediction -->
        <section class="prediction-box" id="predictionBox">

            <div class="prediction-title">
                ✦ YOUR DESTINY ✦
            </div>

            <p id="predictionText">
                The crystal is waiting...
            </p>

        </section>


        <!-- Footer -->
        <footer>
            <span>✦</span>
            THE COSMOS HAS A MESSAGE FOR YOU
            <span>✦</span>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
